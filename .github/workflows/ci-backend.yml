name: ci-backend

on:
  push:
    branches: [main]
  # No `paths` filter: a required check must report on every PR, or PRs that don't touch the
  # backend wait for it forever. The `changes` job decides whether `test` actually runs, and
  # a job skipped through `if:` counts as passing for branch protection.
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            backend=true
          elif git diff --name-only "$BASE_SHA" HEAD \
              | grep -qE '^(backend/|frontend/lib/api/openapi\.json$|\.github/workflows/ci-backend\.yml$)'; then
            backend=true
          else
            backend=false
          fi
          echo "backend=$backend" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: mealfinder
          POSTGRES_PASSWORD: mealfinder
          POSTGRES_DB: mealfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mealfinder" --health-interval 2s --health-retries 30
    env:
      MF_DATABASE_URL: postgresql+asyncpg://mealfinder:mealfinder@localhost:5432/mealfinder
      MF_TEST_DATABASE_URL: postgresql+asyncpg://mealfinder:mealfinder@localhost:5432/mealfinder_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app scripts
      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Single migration head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Tests (on Postgres)
        run: |
          PGPASSWORD=mealfinder psql -h localhost -U mealfinder -c "create database mealfinder_test"
          uv run pytest -q
      - name: OpenAPI snapshot is current
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code ../frontend/lib/api/openapi.json
