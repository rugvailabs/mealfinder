name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up --build --detach --wait
      # Run the tests in the official Playwright image (browsers and system deps
      # preinstalled) instead of `playwright install --with-deps`, whose apt step
      # took up to 9 minutes on the runner. The tag tracks the locked version.
      - name: Resolve Playwright image
        id: pw
        run: echo "version=$(node -p "require('./frontend/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Run Playwright
        run: |
          docker run --rm --network host --ipc host \
            -v "$PWD/frontend:/work" -w /work \
            -e CI=true \
            -e E2E_BASE_URL=http://localhost:3000 \
            -e E2E_API_URL=http://localhost:8000 \
            mcr.microsoft.com/playwright:v${{ steps.pw.outputs.version }}-noble \
            sh -c "npm ci && npx playwright test"
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
